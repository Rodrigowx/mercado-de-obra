name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - "prisma/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/backend-mercado-obra

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker
          buildkitd-config-inline: |
            [worker.oci]
              enabled = true
            [worker.containerd]
              enabled = false

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          builder: ${{ steps.buildx.outputs.name }}
          provenance: false

      # Restante do workflow...

      - name: Run DB Migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL}}" \
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }} \
            npx prisma migrate deploy

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: "backend-mercado-de-obra"
          slot-name: "Production"
          images: "${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}"
          configuration-file: apps/backend/azure-appsettings.json

      - name: Post-Deploy Health Check
        run: |
          curl --retry 10 --retry-delay 5 --retry-connrefused \
            ${{ secrets.BACKEND_URL }}/health
