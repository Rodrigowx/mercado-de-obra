name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - "apps/backend/**"
      - "prisma/**"
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.14.0
          buildkitd-config-inline: |
            version = "0.1"

            [worker]
              oci.enabled = true
              oci.network = "host"
              platforms = ["linux/amd64"]

            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: . 
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Run DB Migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ steps.meta.outputs.version }} \
            npx prisma migrate deploy

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: "backend-mercado-de-obra"
          slot-name: "Production"
          images: "${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ steps.meta.outputs.version }}"
