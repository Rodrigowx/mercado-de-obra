name: Deploy Backend (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch para deploy'
        required: true
        default: 'master'
      version:
        description: 'Versão da imagem (ex: 1.0.0)'
        required: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Configure Build Environment
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [worker.oci]
              enabled = true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ github.event.inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Run Migrations
        run: |
          docker run --rm \
            -v $(pwd)/apps/backend/prisma:/app/prisma \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest \
            npx prisma migrate deploy --schema=./prisma/schema.prisma

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-mercado-de-obra'
          slot-name: 'production'
          images: '${{ secrets.DOCKERHUB_USERNAME }}/backend-app:${{ github.event.inputs.version }}'