name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch para deploy"
        required: true
        default: "master"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          buildkitd-config-inline: |
            [worker.oci]
              enabled = true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
          build-args: |
            NODE_ENV=production

      - name: Run Migrations
        run: |
          docker run --rm \
            -e LD_LIBRARY_PATH=/usr/lib \
            -e PRISMA_ENGINE_LIBRARY=/usr/lib/libssl.so.3 \
            -e PRISMA_QUERY_ENGINE_LIBRARY=/usr/lib/libssl.so.3 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            -v ${{ github.workspace }}/apps/backend/prisma:/app/prisma \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest \
            npx prisma migrate deploy --schema=./prisma/schema.prisma
      
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: "backend-mercado-de-obra"
          slot-name: "production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BACK }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
