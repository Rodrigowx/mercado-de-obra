name: Deploy Backend na Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Instalar dependências
        run: |
          cd apps/backend  # ENTRAR NA PASTA DO BACKEND
          npm install

      - name: Gerar build
        run: |
          cd apps/backend  # ENTRAR NA PASTA DO BACKEND
          npm run build

      - name: Criar arquivo .env com variáveis do Azure
        run: |
          cd apps/backend  # ENTRAR NA PASTA DO BACKEND
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "NODE_ENV=production" >> .env
          echo "PORT=5000" >> .env
        shell: bash

      - name: Upload artifact para deployment
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: apps/backend  # GARANTIR QUE ESTAMOS PEGANDO OS ARQUIVOS CERTOS

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Baixar artifact da build
        uses: actions/download-artifact@v4
        with:
          name: backend-app

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy no Azure App Service
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'backend-mercado-de-obra'
          slot-name: 'Production'
          package: .
