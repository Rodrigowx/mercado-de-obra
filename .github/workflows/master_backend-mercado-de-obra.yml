name: Deploy Backend

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch para deploy"
        required: true
        default: "master"

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0 

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest  
      - name: Run Migrations and Seed
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL}}" \
            -e NODE_ENV=production \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest \
            sh -c "npx prisma migrate deploy --schema=./prisma/schema.prisma && \
                    npx prisma db seed --schema=./prisma/schema.prisma"

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: "backend-mercado-de-obra"
          slot-name: "production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BACK }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest