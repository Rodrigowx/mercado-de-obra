name: Deploy Chat Service

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch para deploy"
        required: true
        default: "master"

jobs:
  deploy-chat:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0 # Necessário para o Prisma

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/chat-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest

      - name: Run Database Migrations
        run: |
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL_MONGO}}" \
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest \
            npx prisma migrate deploy

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: "chat-mercado-de-obra"
          slot-name: "production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CHAT }}
          images: ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest
