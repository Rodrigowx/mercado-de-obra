name: Deploy Chat Service (Manual)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão da imagem (ex: 1.0.0)'
        required: true

jobs:
  deploy-chat:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Chat Service
        uses: docker/build-push-action@v5
        with:
          context: apps/chat-service
          file: apps/chat-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:${{ github.event.inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest
          cache-from: type=gha,scope=chat
          cache-to: type=gha,mode=max,scope=chat
          
      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-mercado-de-obra'
          slot-name: 'production'
          images: '${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest'