name: Deploy Chat Service

on:
  push:
    branches: [master]
    paths:
      - 'apps/chat-service/**'
      - 'prisma/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/chat-mercado-obra

jobs:
  deploy-chat:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          config-inline: |
            [worker.containerd]
              enabled = true

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Chat Image
        uses: docker/build-push-action@v5
        with:
          context: apps/chat-service
          file: apps/chat-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          builder: ${{ steps.buildx.outputs.name }}
          provenance: false

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-mercado-de-obra'
          slot-name: 'Production'
          images: '${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}'
          configuration-file: apps/chat-service/azure-appsettings.json

      - name: WebSocket Smoke Test
        run: |
          timeout 20 bash -c 'until echo > /dev/tcp/${{ secrets.CHAT_SERVICE_DOMAIN }}/443; do sleep 1; done'