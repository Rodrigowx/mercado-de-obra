permissions:
  id-token: write
  contents: read

name: Build and Deploy Chat to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_push_chat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL_MONGO: ${{ secrets.DATABASE_URL_MONGO }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      PORT: 4000
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Chat Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chat-app:latest -f apps/chat-service/Dockerfile .

      - name: Push Chat Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chat-app:latest

  deploy_chat:
    runs-on: ubuntu-latest
    needs: build_and_push_chat
    steps:
      - name: Deploy Chat Container to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-mercado-de-obra'
          slot-name: 'Production'
          images: ${{ secrets.DOCKERHUB_USERNAME }}/chat-app:latest
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_CHAT }}
          env: |
            PORT=4000
