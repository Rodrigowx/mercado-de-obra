name: Deploy Chat Service

on:
  push:
    branches: [master]
    paths:
      - 'apps/chat-service/**'
  workflow_dispatch:

jobs:
  deploy-chat:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: apps/chat-service
          file: apps/chat-service/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-service'
          slot-name: 'production'
          images: '${{ secrets.DOCKERHUB_USERNAME }}/chat-service:latest'