name: Deploy Chat Service

on:
  push:
    branches: [master]
    paths:
      - 'apps/chat-service/**'
      - 'prisma/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/chat-app

jobs:
  deploy-chat:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3
        id: buildx
        with:
          version: v0.14.0
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:v0.14.0
          buildkitd-config: |
            [worker.oci]
              enabled = true
              network = "host"
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build & Push Chat Image
        uses: docker/build-push-action@v5
        with:
          context: apps/chat-service
          file: apps/chat-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ github.workflow }}-chat
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-chat
          builder: ${{ steps.buildx.outputs.name }}
          provenance: false
          sbom: false

      - name: Verify Build
        run: |
          docker buildx version
          docker buildx inspect
          docker buildx du --verbose

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-mercado-de-obra'
          slot-name: 'Production'
          images: '${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}'