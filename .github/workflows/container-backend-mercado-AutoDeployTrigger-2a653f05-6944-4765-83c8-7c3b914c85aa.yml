name: Trigger auto deployment for container-backend-mercado

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch para deploy"
        required: true
        default: "master"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Necessário para solicitar o OIDC JWT Token
      contents: read # Necessário se você usa token do GitHub para repositórios privados

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      # 🔐 Autenticação no Docker Hub antes do Build
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 🔵 Login no Azure para Deploy
      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CONTAINERBACKENDMERCADO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERBACKENDMERCADO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERBACKENDMERCADO_AZURE_SUBSCRIPTION_ID }}

      # 🔧 Build e Push da Imagem para o Docker Hub
      - name: Build and push container image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
          build-args: |
            AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
            AZURE_STORAGE_ACCOUNT_NAME=${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
            AZURE_STORAGE_ACCOUNT_KEY=${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
            AZURE_STORAGE_CONTAINER_NAME=${{ secrets.AZURE_STORAGE_CONTAINER_NAME }}
            AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING=${{ secrets.AZURE_COMMUNICATION_EMAIL_CONNECTION_STRING }}
            AZURE_COMMUNICATION_EMAIL_SENDER=${{ secrets.AZURE_COMMUNICATION_EMAIL_SENDER }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}

      # 🚀 Rodar as migrações do Prisma
      - name: Run Prisma Migrations
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest"
          echo "Executando migrações do Prisma na imagem: $IMAGE_NAME"
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            $IMAGE_NAME \
            npx prisma migrate deploy

      # 🌱 Rodar o Prisma Seed para popular o banco de dados
      - name: Run Prisma Seed
        run: |
          IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest"
          echo "Executando seed do Prisma na imagem: $IMAGE_NAME"
          docker run --rm \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            $IMAGE_NAME \
            npx prisma db seed

      # 🚀 Deploy no Azure Container Apps
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: container-backend-mercado
          resourceGroup: mercado-de-obra
          registryUrl: docker.io
          registryUsername: ${{ secrets.DOCKERHUB_USERNAME }}
          registryPassword: ${{ secrets.DOCKERHUB_PASSWORD }}
          imageToDeploy: ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest
