name: Trigger auto deployment for container-backend-mercado

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/container-backend-mercado-AutoDeployTrigger-2a653f05-6944-4765-83c8-7c3b914c85aa.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.CONTAINERBACKENDMERCADO_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERBACKENDMERCADO_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERBACKENDMERCADO_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}apps/backend
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: docker.io
          registryUsername: ${{ secrets.CONTAINERBACKENDMERCADO_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERBACKENDMERCADO_REGISTRY_PASSWORD }}
          containerAppName: container-backend-mercado
          resourceGroup: mercado-de-obra
          imageToBuild: rodrigowx/container-backend-mercado:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


