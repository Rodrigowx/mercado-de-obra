permissions:
  id-token: write
  contents: read

name: Build and Deploy Containers to Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_and_push_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest -f apps/backend/Dockerfile .

      - name: Run Prisma Migrations (inside Docker)
        run: |
          docker run --rm \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest \
            npx prisma migrate deploy

      - name: Run Prisma Seed (inside Docker)
        run: |
          docker run --rm \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest \
            npm run prisma:seed

      - name: Push Backend Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest

  deploy_backend:
    runs-on: ubuntu-latest
    needs: build_and_push_backend
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FDCACB85F5764FA0A1CA8889771CA26B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D82A1DC52B094BF5B8B2BAF35E3D97E1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B8DFDB741F1F4809ABE822BB8B45AF02 }}

      - name: Deploy Backend Container to Azure
        run: |
          az webapp config container set \
            --resource-group mercado-de-obra \
            --name backend-mercado-de-obra \
            --container-image-name ${{ secrets.DOCKERHUB_USERNAME }}/backend-app:latest

  build_and_push_chat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL_MONGO: ${{ secrets.DATABASE_URL_MONGO }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Chat Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/chat-app:latest -f apps/chat-service/Dockerfile .

      - name: Push Chat Image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/chat-app:latest

  deploy_chat:
    runs-on: ubuntu-latest
    needs: build_and_push_chat
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2D46DA4A57574A1B84C6761DB95F1E86 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0846BE292398488C822C6B31AEE8078F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_80DE4F4C51B2457DBB52E547D25611F8 }}

      - name: Deploy Chat Container to Azure
        run: |
          az webapp config container set \
            --resource-group mercado-de-obra \
            --name chat-mercado-de-obra \
            --container-image-name ${{ secrets.DOCKERHUB_USERNAME }}/chat-app:latest
