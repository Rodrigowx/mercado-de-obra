name: Build and deploy Node.js apps to Azure Web Apps

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build_backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}

    if: contains(github.event.head_commit.message, 'run-ymlback')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version (backend)
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: npm install, build, and test (backend)
        run: |
          cd ./apps/backend
          npm install
          npm run build --if-present

      - name: Run Prisma Migrations (backend)
        run: |
          cd ./apps/backend
          npx prisma migrate deploy

      - name: Run Prisma seed script (backend)
        run: |
          cd ./apps/backend
          npm run prisma:seed

      - name: Zip backend artifact
        run: zip backend-release.zip ./* -r

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-app
          path: backend-release.zip

  deploy_backend:
    runs-on: ubuntu-latest
    needs: build_backend
    environment:
      name: "Production"
      url: ${{ steps.deploy-backend.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-app

      - name: Unzip backend artifact
        run: unzip backend-release.zip

      - name: Login to Azure (backend)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FDCACB85F5764FA0A1CA8889771CA26B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D82A1DC52B094BF5B8B2BAF35E3D97E1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B8DFDB741F1F4809ABE822BB8B45AF02 }}

      - name: Deploy backend to Azure Web App
        id: deploy-backend
        uses: azure/webapps-deploy@v3
        with:
          app-name: "backend-mercado-de-obra"
          slot-name: "Production"
          package: .

  build_chat:
    runs-on: ubuntu-latest
    needs: deploy_backend
    permissions:
      contents: read
    env:
      DATABASE_URL_MONGO: ${{ secrets.DATABASE_URL_MONGO }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version (chat)
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: npm install, build (chat)
        run: |
          cd ./apps/chat-service
          npm install
          npm run build --if-present

      - name: Zip chat artifact
        run: zip chat-release.zip ./* -r

      - name: Upload chat artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-app
          path: chat-release.zip

  deploy_chat:
    runs-on: ubuntu-latest
    needs: build_chat
    environment:
      name: "Production"
      url: ${{ steps.deploy-chat.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    if: contains(github.event.head_commit.message, 'run-ymlback')
    steps:
      - name: Download chat artifact
        uses: actions/download-artifact@v4
        with:
          name: chat-app

      - name: Unzip chat artifact
        run: unzip chat-release.zip

      - name: Login to Azure (chat)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2D46DA4A57574A1B84C6761DB95F1E86 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_0846BE292398488C822C6B31AEE8078F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_80DE4F4C51B2457DBB52E547D25611F8 }}

      - name: Deploy chat to Azure Web App
        id: deploy-chat
        uses: azure/webapps-deploy@v3
        with:
          app-name: "chat-mercado-de-obra"
          slot-name: "Production"
          package: .
