# Deploy automático do Chat-Service para o Azure Web App

name: Build and deploy Node.js app to Azure Web App - chat-service

on:
  push:
    branches:
      - master  # Altere para sua branch principal, se necessário
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # Necessário para actions/checkout

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'  # Mantendo Node.js 22.x conforme solicitado

      - name: Instalar dependências
        run: |
          cd apps/chat-service  # Entrar na pasta do chat-service
          npm install

      - name: Criar arquivo .env com variáveis do Azure (se necessário)
        run: |
          cd apps/chat-service  # Entrar na pasta do chat-service
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" >> .env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> .env
          echo "NODE_ENV=production" >> .env
          echo "PORT=3001" >> .env
        shell: bash

      - name: Construir o projeto
        run: |
          cd apps/chat-service  # Entrar na pasta do chat-service
          npm run build --if-present

      - name: Executar testes (opcional)
        run: |
          cd apps/chat-service
          npm run test --if-present

      - name: Compactar para deployment
        run: |
          cd apps/chat-service
          zip -r ../../release.zip .  # Criando o ZIP corretamente

      - name: Upload artifact para o job de deploy
        uses: actions/upload-artifact@v4
        with:
          name: chat-service-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write  # Necessário para autenticação no Azure
      contents: read

    steps:
      - name: Baixar artifact da build
        uses: actions/download-artifact@v4
        with:
          name: chat-service-app

      - name: Descompactar o artifact
        run: unzip release.zip

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}

      - name: Deploy no Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'chat-service'  # Nome do App Service no Azure
          slot-name: 'Production'
          package: .
