name: Deploy Chat-Service na Azure

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      DATABASE_URL_MONGO: ${{ secrets.DATABASE_URL_MONGO }} # URL do MongoDB para chat-service
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }} # URL do Frontend (para CORS, etc.)
      PORT: 8080

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Instalar dependências
        run: |
          cd apps/chat-service
          npm install --include=dev
          # OU: npm ci --include=dev

      - name: Instalar NestJS CLI
        run: npm install -g @nestjs/cli

      - name: Gerar build do NestJS
        run: |
          export DATABASE_URL_MONGO=${{ secrets.DATABASE_URL_MONGO }}
          export FRONTEND_URL=${{ secrets.FRONTEND_URL }}
          cd apps/chat-service
          npx nest build

      - name: Compactar artefato para deploy
        run: |
          cd apps/chat-service
          zip -r ../../chat-service.zip dist package.json package-lock.json

      - name: Upload artifact para deploy
        uses: actions/upload-artifact@v4
        with:
          name: chat-service-app
          path: chat-service.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "Production"
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Baixar artifact da build
        uses: actions/download-artifact@v4
        with:
          name: chat-service-app

      - name: Descompactar artifact
        run: unzip chat-service.zip

      - name: Login no Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BF8EBD6AB9BA4F5091FFDA73D5E7AE65 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D42E45FD39434833980641E304937979 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F16FBAB6BA214F73B2AD071B4B47D89B }}

      - name: Deploy no Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "chat-service"
          slot-name: "Production"
          package: .
